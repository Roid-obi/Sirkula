<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Squircle Base Emerald -->
  <rect width="64" height="64" rx="16" fill="#16A34A"/>
  
  <!-- Bottle Cap -->
  <rect x="27" y="10" width="10" height="4.5" rx="1.5" fill="#FFFFFF"/>
  <rect x="25.5" y="14.5" width="13" height="2" rx="1" fill="#BBF7D0"/>
  
  <!-- Upper Left to Bottom Right Swoosh forming Left Bottle Wall -->
  <path d="M26.5 17C26.5 19 21.5 21.5 21.5 27V44C21.5 48 24 51.5 28 52C33 52.5 38 48 38 42" 
        stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Arrow Head on Left/Bottom Loop -->
  <path d="M35 44.5L38.2 41.5L41 45" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Lower Right to Top Left Swoosh forming Right Bottle Wall -->
  <path d="M37.5 17C37.5 19 42.5 21.5 42.5 27V36C42.5 41 39 44 35 44C30 44 26 39 26 33" 
        stroke="#BBF7D0" stroke-width="2.8" stroke-linecap="round"/>
  <!-- Arrow Head on Upper Loop -->
  <path d="M29 35L25.8 32.5L23 35.5" stroke="#BBF7D0" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Central Sparkle/Node -->
  <circle cx="32" cy="37" r="2.8" fill="#FFFFFF"/>
</svg>